name: reserves

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env.prod
    volumes:
      - backend-data:/app/instance
      - ${DB_PATH}:${DB_PATH}
    expose:
      - "5000"
    networks:
      - app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_APP_FAVICON_PATH==${VITE_APP_FAVICON_PATH}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./.env.prod
    ports:
      - "8084:80"
    depends_on:
      - backend
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  backend-data:
